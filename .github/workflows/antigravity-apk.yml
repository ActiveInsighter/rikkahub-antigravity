name: Antigravity Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: antigravity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure preinstalled Android SDK
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$SDK_MANAGER" --version
          # yes exits with SIGPIPE after sdkmanager finishes reading its input.
          set +o pipefail
          yes | "$SDK_MANAGER" --licenses > /dev/null
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-37.2' 'cmake;3.22.1'
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml
      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare debug Firebase configuration
        run: python3 tools/antigravity/prepare-debug.py
      - name: Restore persistent debug signing key
        env:
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$DEBUG_KEYSTORE" || { echo 'Missing ANDROID_DEBUG_KEYSTORE_BASE64 repository secret'; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/rikkahub-debug.keystore"
          printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "RIKKA_DEBUG_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Test Gemini and Antigravity Interactions
        run: >-
          ./gradlew :ai:testDebugUnitTest
          --tests me.rerere.ai.provider.providers.google.InteractionsApiTest
          --tests me.rerere.ai.util.RequestLogRedactionTest
          --no-daemon --max-workers=2
          '-Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8'
      - name: Build signed debug APKs
        run: >-
          ./gradlew :app:assembleGithubDebug
          --no-daemon --max-workers=2
          '-Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8'
      - name: Verify APK signatures and prepare downloads
        run: |
          APK_PREFIX="RikkaHub-3.2.0-antigravity"
          echo "APK_PREFIX=$APK_PREFIX" >> "$GITHUB_ENV"
          mkdir -p artifacts
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          EXPECTED_CERT=$(keytool -exportcert -keystore "$RIKKA_DEBUG_KEYSTORE" -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)
          for apk in app/build/outputs/apk/github/debug/*.apk; do
            "$APK_SIGNER" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-signature.txt"
            cat "$RUNNER_TEMP/apk-signature.txt"
            grep -Fi -- "$EXPECTED_CERT" "$RUNNER_TEMP/apk-signature.txt"
            name=$(basename "$apk")
            cp "$apk" "artifacts/$APK_PREFIX-${name#app-github-}"
          done
          cd artifacts
          sha256sum *.apk > SHA256SUMS.txt
          {
            echo '### APK SHA-256'
            echo '~~~text'
            cat SHA256SUMS.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      # Match the filename in each name input so overwrite can replace earlier attempts.
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_PREFIX }}-arm64-v8a-debug.apk
          path: artifacts/${{ env.APK_PREFIX }}-arm64-v8a-debug.apk
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 90
      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_PREFIX }}-x86_64-debug.apk
          path: artifacts/${{ env.APK_PREFIX }}-x86_64-debug.apk
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 90
      - name: Upload universal APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_PREFIX }}-universal-debug.apk
          path: artifacts/${{ env.APK_PREFIX }}-universal-debug.apk
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 90
      - name: Publish downloadable APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "antigravity-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" artifacts/* \
            --target "$GITHUB_SHA" --prerelease \
            --title "RikkaHub 3.2.0 Antigravity · Build ${GITHUB_RUN_NUMBER}" \
            --notes-file docs/ANTIGRAVITY-RELEASE.md
      - name: Remove signing key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/rikkahub-debug.keystore"
