name: Antigravity Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Prepare the initial signed R2 update catalog
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify the published source and target APKs
        env:
          GH_TOKEN: ${{ github.token }}
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEBUG_KEYSTORE"
          keystore_path="$RUNNER_TEMP/rikkahub-debug.keystore"
          umask 077
          printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$keystore_path"
          echo "RIKKA_DEBUG_KEYSTORE=$keystore_path" >> "$GITHUB_ENV"

          target_tag=antigravity-118-1
          for attempt in {1..40}; do
            if gh release view "$target_tag" --json targetCommitish --jq '.targetCommitish' > "$RUNNER_TEMP/target-commit"; then
              break
            fi
            sleep 15
          done
          test "$(cat "$RUNNER_TEMP/target-commit")" = df1b6c09861b8828d15caffc411acd939ca28724
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          aapt_tool=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)
          cert=$(keytool -exportcert -keystore "$keystore_path" -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)
          for build in 116 118; do
            gh release download "antigravity-$build-1" --pattern '*-debug.apk' --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/releases/$build"
            if [[ "$build" == 116 ]]; then
              version_code=197
            else
              version_code=$((100000 + build))
            fi
            (
              cd "$RUNNER_TEMP/releases/$build"
              sha256sum -c SHA256SUMS.txt
              for apk in *.apk; do
                "$signer" verify --print-certs "$apk" > "$RUNNER_TEMP/signature"
                grep -Fi "$cert" "$RUNNER_TEMP/signature"
                "$aapt_tool" dump badging "$apk" > "$RUNNER_TEMP/badging"
                grep -F "name='me.rerere.rikkahub.debug'" "$RUNNER_TEMP/badging"
                grep -F "versionCode='$version_code'" "$RUNNER_TEMP/badging"
                grep -F "versionName='3.3.0'" "$RUNNER_TEMP/badging"
              done
            )
          done

      - name: Generate, verify, and sign the R2 bundle
        shell: bash
        run: |
          bash tools/antigravity/install-hdiffpatch.sh "$RUNNER_TEMP/hdiffpatch"
          PYTHONPATH=tools/antigravity python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path
          from types import SimpleNamespace

          from publish_updates import ABIS, PACKAGE_NAME, apk_key, digest, json_bytes, publish, read_signed_catalog, sign

          temp = Path(os.environ["RUNNER_TEMP"])

          class BundleStore:
              def __init__(self, root):
                  self.root = root
                  self.legacy_files = {}
                  self.legacy_apks = []
                  for abi in ABIS:
                      (path,) = (temp / "releases" / "116").glob(f"*-{abi}-debug.apk")
                      apk = {"abi": abi, "sha256": digest(path), "size": path.stat().st_size}
                      self.legacy_files[apk_key(197, apk)] = path
                      self.legacy_apks.append(apk)

              def read_catalog(self):
                  catalog = self.root / "catalog.json"
                  if catalog.exists():
                      return read_signed_catalog(catalog.read_bytes()), None
                  return [{"versionCode": 197, "apks": self.legacy_apks}], None

              def get_file(self, key, destination):
                  shutil.copyfile(self.legacy_files[key], destination)

              def put_file(self, key, path, content_type):
                  destination = self.root / key
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(path, destination)

              def write_catalog(self, builds, etag):
                  current_builds = [build for build in builds if build["versionCode"] >= 100001]
                  payload = json_bytes({"schemaVersion": 1, "packageName": PACKAGE_NAME, "builds": current_builds})
                  (self.root / "catalog.json").write_bytes(sign(payload))

              def prune(self, builds):
                  pass

          store = BundleStore(temp / "r2-bundle")
          publish(store, SimpleNamespace(
              apk_dir=temp / "releases" / "118",
              hdiff_tools=temp / "hdiffpatch",
              work_dir=temp,
              build_number=118,
              version_code=100118,
              version_name="3.3.0",
              commit="df1b6c09861b8828d15caffc411acd939ca28724",
          ))
          builds, _ = store.read_catalog()
          assert [build["buildNumber"] for build in builds] == [118]
          assert any(patch["baseVersionCode"] == 197 for apk in builds[0]["apks"] for patch in apk["patches"])
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: signed-r2-bootstrap-118
          path: ${{ runner.temp }}/r2-bundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
